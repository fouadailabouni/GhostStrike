name: CI - GhostStrike Pentest Framework

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Scripts

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq

    - name: Syntax check (bash -n) on every script
      run: |
        status=0
        while IFS= read -r -d '' f; do
          bash -n "$f" || status=1
        done < <(find bash_scripts_for_pentest -name "*.sh" -not -path "*/pentest_lab/*" -print0)
        exit $status

    - name: ShellCheck (error severity only -- style/info-level findings are not yet triaged)
      run: |
        find bash_scripts_for_pentest -name "*.sh" -not -path "*/pentest_lab/*" -print0 \
          | xargs -0 shellcheck -S error

    - name: Check for hardcoded secret literals
      run: |
        # Matches VAR="literal" at a statement boundary, not VAR="$other_var"
        # and not a keyword appearing mid-string (e.g. a SQLi payload like
        # "...&password=' or '1'='1" -- "password" there isn't preceded by a
        # statement boundary, it's embedded in a larger quoted string one
        # already-open-quote deep). Also excludes well-known placeholder
        # values (SAMPLE_, CHANGEME, etc.) so a module that fills in a
        # "no real value found" fallback string doesn't trip this.
        if grep -r -i -E "(^|[[:space:];{])(password|passwd|secret|token|api_key)\s*=\s*['\"][^'\"\$][^'\"]*['\"]" \
            --include="*.sh" bash_scripts_for_pentest \
            | grep -v -i "AUTHORIZATION DISCLAIMER" \
            | grep -v -iE "sample_|changeme|your_|example_|placeholder|dummy_"; then
          echo "Potential hardcoded secret literal found"
          exit 1
        fi

    - name: Validate JSON schemas
      run: |
        status=0
        while IFS= read -r -d '' f; do
          jq . "$f" >/dev/null 2>&1 || { echo "Invalid JSON: $f"; status=1; }
        done < <(find bash_scripts_for_pentest -name "*.json" -print0)
        exit $status

  python:
    runs-on: ubuntu-latest
    name: Python Quality

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python check tools
      run: pip install --break-system-packages ruff bandit pytest pyyaml jsonschema

    - name: Syntax check every .py file
      run: |
        status=0
        while IFS= read -r -d '' f; do
          python3 -m py_compile "$f" || status=1
        done < <(find CyberToolkit bash_scripts_for_pentest -name "*.py" -not -path "*/pentest_lab/*" -print0)
        exit $status

    - name: Ruff (informational -- not yet a hard gate)
      # First-ever Ruff pass on this codebase found 550 pre-existing
      # findings; gating on day one would block unrelated PRs on untriaged
      # noise instead of catching real regressions. Remove --exit-zero once
      # the backlog is triaged -- see docs/TESTING.md.
      run: ruff check CyberToolkit bash_scripts_for_pentest --exit-zero

    - name: Bandit -- medium/high only (informational -- not yet a hard gate)
      # Same reasoning as Ruff: 16 pre-existing medium/high findings on the
      # first run. Printed for visibility, not yet blocking.
      run: bandit -r CyberToolkit bash_scripts_for_pentest -ll -q --exclude "*/pentest_lab/*" || true

    - name: pytest
      run: |
        if find tests -name "test_*.py" 2>/dev/null | grep -q .; then
          pytest tests/ -v
        else
          echo "No pytest test files found, skipping"
        fi

  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
    - uses: actions/checkout@v4

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bats jq python3-yaml

    - name: Run BATS tests
      run: |
        if [ -d "bash_scripts_for_pentest/tests" ] && find bash_scripts_for_pentest/tests -name "*.bats" | grep -q .; then
          bats bash_scripts_for_pentest/tests/
        else
          echo "No .bats files found, skipping"
        fi

    - name: Module smoke test (syntax, no-args crash, --help)
      run: bash tests/module_smoke_test.sh

  security:
    runs-on: ubuntu-latest
    name: Security Checks

    steps:
    - uses: actions/checkout@v4

    - name: Verify authorization disclaimers
      run: |
        # Scoped to attack modules only -- lib/ is sourced plumbing, not
        # something an operator runs directly, so it doesn't carry this
        # per-module disclaimer.
        missing=0
        while IFS= read -r -d '' script; do
          grep -q "AUTHORIZATION DISCLAIMER" "$script" || { echo "Missing disclaimer: $script"; missing=$((missing + 1)); }
        done < <(find bash_scripts_for_pentest -name "*.sh" -not -path "*/pentest_lab/*" -not -path "*/lib/*" -print0)
        if [ "$missing" -gt 0 ]; then
          echo "$missing script(s) missing the authorization disclaimer"
          exit 1
        fi
